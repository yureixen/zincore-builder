name: Build Kernel

on:
  workflow_dispatch:
    inputs:
      device:
        description: "Device to build"
        required: true
        type: choice
        options:
          - sweet
      create_release:
        description: "Create a GitHub Release after build"
        required: true
        type: boolean
        default: false

jobs:
  set-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - id: gen
        run: |
          VARIANTS=$(jq -c '.["${{ inputs.device }}"].variants' "devices/${{ inputs.device }}.json")
          MATRIX=$(echo "$VARIANTS" | jq -c '{include: [.[] | {variant: .}]}')
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  build:
    needs: set-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.set-matrix.outputs.matrix) }}
    steps:
      - name: Checkout builder
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: builder

      - name: Set up swap space
        uses: pierotofy/set-swap-space@49819abfb41bd9b44fb781159c033dba90353a7c
        with:
          swap-size-gb: 10

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc cpio flex bison libssl-dev \
            libelf-dev dwarves zip curl git python3 rsync

      - name: Clone kernel source
        run: |
          KERNEL_REPO=$(python3 -c "import json;print(json.load(open('builder/devices/${{ inputs.device }}.json'))['${{ inputs.device }}']['kernel_repo'])")
          KERNEL_BRANCH=$(python3 -c "import json;print(json.load(open('builder/devices/${{ inputs.device }}.json'))['${{ inputs.device }}']['kernel_branch'])")
          git clone --depth 1 -b "$KERNEL_BRANCH" "$KERNEL_REPO" kernel_src

      - name: Stage builder files into kernel source
        run: |
          cp -r builder/devices kernel_src/
          cp -r builder/scripts kernel_src/
          cp builder/config.env kernel_src/

      - name: Build (${{ inputs.device }} / ${{ matrix.variant }})
        working-directory: kernel_src
        run: |
          set -euo pipefail
          source config.env
          source scripts/env.sh "${{ inputs.device }}"
          bash scripts/patches.sh
          bash scripts/goodies.sh "${{ inputs.device }}" "${{ matrix.variant }}"
          bash scripts/compile.sh "${{ inputs.device }}" "${{ matrix.variant }}"

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: zincore-${{ inputs.device }}-${{ matrix.variant }}
          path: |
            kernel_src/zincore-${{ inputs.device }}-${{ matrix.variant }}-*.zip
            kernel_src/${{ inputs.device }}-${{ matrix.variant }}-build.log
            kernel_src/${{ inputs.device }}-${{ matrix.variant }}-config
          if-no-files-found: error

      - name: Upload KSU version info
        if: matrix.variant == 'ksu'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: zincore-${{ inputs.device }}-${{ matrix.variant }}-versions
          path: |
            kernel_src/${{ inputs.device }}-resukisu-version.txt
            kernel_src/${{ inputs.device }}-susfs-version.txt
          if-no-files-found: error

  release:
    needs: build
    if: ${{ inputs.create_release }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: release_files

      - name: Flatten artifact folders
        run: |
          mkdir -p final
          find release_files -type f -exec mv {} final/ \;

      - name: Compose release notes
        id: notes
        run: |
          {
            echo "> [!NOTE]"
            if ls final/*-resukisu-version.txt >/dev/null 2>&1; then
              echo "> - ReSukiSU Version: $(cat final/*-resukisu-version.txt)"
            fi
            if ls final/*-susfs-version.txt >/dev/null 2>&1; then
              echo "> - SuSFS Version: $(cat final/*-susfs-version.txt)"
            fi
            echo ""
            echo "> [!CAUTION]"
            echo "> - Always back up your boot.img before flashing!"
          } > release_notes.md
          cat release_notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DATE=$(date +'%Y/%m/%d')
          gh release create "${{ inputs.device }}-${{ github.run_id }}" \
            --repo "${{ github.repository }}" \
            --title "zincore-${{ inputs.device }} - ${DATE}" \
            --notes-file release_notes.md \
            final/*.zip
