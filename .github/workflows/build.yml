name: Build Zincore-Sweet

on:
  workflow_dispatch:
    inputs:
      android_version:
        description: 'Target Android version (selects matching Clang)'
        required: true
        type: choice
        default: '16'
        options:
          - '13'
          - '14'
          - '15'
          - '16'
      release:
        description: 'Upload to GitHub Release?'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.variant }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        variant: [stock, ksu]

    outputs:
      timestamp: ${{ steps.ts.outputs.TIME }}
      date:      ${{ steps.ts.outputs.DATE }}

    steps:
      # Checkout builder repo
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Timestamp
      - name: Timestamp
        id: ts
        run: |
          echo "DATE=$(date +'%Y%m%d')" >> "$GITHUB_OUTPUT"
          echo "TIME=$(date +'%s')"     >> "$GITHUB_OUTPUT"

      # Install dependencies
      - name: Install Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            bc build-essential bison flex zip \
            libc6 curl libstdc++6 git wget libssl-dev \
            zstd lld python3 patchutils ccache \
            libelf-dev cpio lz4 pahole \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      # toolchain + kernel + AnyKernel3
      - name: Setup Environment
        env:
          ANDROID_VERSION: ${{ inputs.android_version }}
        run: bash scripts/setup.sh

      # Apply patches
      - name: Apply Patches
        env:
          VARIANT: ${{ matrix.variant }}
        run: bash scripts/patches.sh

      # Compile
      - name: Compile Kernel
        env:
          VARIANT: ${{ matrix.variant }}
        run: bash scripts/compile.sh

      # Upload artifact
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zincore-sweet-${{ matrix.variant == 'ksu' && 'ksu' || 'nsu' }}-${{ steps.ts.outputs.DATE }}-${{ steps.ts.outputs.TIME }}
          path: ${{ github.workspace }}/AnyKernel3/zincore-sweet-*.zip
          if-no-files-found: error
          retention-days: 7

  # Release job
  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: ${{ inputs.release == 'true' }}
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: List artifacts
        run: ls -lah artifacts/

      - name: Fancy date
        id: ts
        run: echo "FANCYDATE=$(date +'%Y/%m/%d')" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: zincore-${{ needs.build.outputs.timestamp }}
          name: "Zincore Kernel — ${{ steps.ts.outputs.FANCYDATE }}"
          draft: false
          prerelease: false
          body: |
            See the [README](https://github.com/yureixen/zincore-builder#readme) for variant details, credits, and flashing instructions.

            > [!CAUTION]
            > Always backup your boot image before flashing!
          files: artifacts/**/*.zip
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
